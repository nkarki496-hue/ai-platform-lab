# A Role grants nothing on its own. The binding is what attaches it to an identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted-sa-pod-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: restricted-sa
    namespace: demo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
