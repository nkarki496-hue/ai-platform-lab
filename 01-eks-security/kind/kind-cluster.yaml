# Three nodes: one control plane, two workers.
#
# Two workers (not one) so a node can be cordoned and drained while pods
# still have somewhere to reschedule — which is what makes Pod Disruption
# Budget testing meaningful.
#
# The default CNI is disabled on purpose. kind's built-in kindnet accepts
# NetworkPolicy objects but does not enforce them, so every policy test
# would pass whether the policy worked or not. Calico is installed after
# cluster creation so enforcement is real.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: seclab
nodes:
  - role: control-plane
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
