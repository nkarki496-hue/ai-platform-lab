# A 3-node cluster: one control plane, two workers.
# Two workers so you can drain one and watch pods reschedule.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: seclab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Expose the API server audit log settings later in the lab
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
    extraMounts:
      - hostPath: ./audit
        containerPath: /etc/kubernetes/policies
      - hostPath: ./audit-logs
        containerPath: /var/log/kubernetes
  - role: worker
  - role: worker
networking:
  # Disable the default CNI so we can install Calico and get real NetworkPolicy
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
